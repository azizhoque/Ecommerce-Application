spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/order
    username: postgres
    password: root123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    producer:
      bootstrap-servers: localhost:9092
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: orderConfirmation:com.ecom.kafka.producer.OrderConfirmation
server:
  port: 8070

application:
  config:
    customer-url: http://localhost:8222/v1/api/customer
    payment-url: http://localhost:8222/v1/api/payment
    product-url: http://localhost:8222/v1/api/product